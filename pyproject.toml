[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kctx"
version = "0.1.0"
description = "Typed knowledge workspace CLI with a Lean-checked semantic core"
requires-python = ">=3.11"
dependencies = ["pydantic==2.14.1", "structlog==26.1.0", "cryptography==46.0.3", "PyMySQL==1.1.2", "click==8.3.0", "rich==14.2.0"]

[project.scripts]
kctx = "kctx.cli.app:main"

[dependency-groups]
dev = ["pyright[nodejs]==1.1.407", "ruff==0.14.5", "types-PyMySQL==1.1.0.20250916"]

[tool.hatch.build.targets.wheel]
packages = ["src/kctx"]

[tool.uv]
python-preference = "only-system"
python-downloads = "never"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ANN", "RUF"]
